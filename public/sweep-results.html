<!DOCTYPE html>
<html data-i18n-title="page.title.sweep">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="jobs"></header>

    <main class="app-main">
      <div id="loadingState" class="loading-spinner"><div class="spinner"></div></div>

      <div id="errorState" class="empty-state hidden">
        <div class="empty-state-icon"><i data-icon="warning"></i></div>
        <h3 data-i18n="sweep.not_found"></h3>
        <a href="/jobs.html" class="btn btn-ghost" data-i18n="sweep.back"></a>
      </div>

      <div id="sweepContent" class="hidden">
        <div class="page-header">
          <div class="page-header-left">
            <h1 id="sweepTitle"></h1>
            <p id="sweepMeta"></p>
          </div>
          <div class="page-header-actions">
            <span class="status-badge" id="sweepStatusBadge"><span class="status-dot"></span><span id="sweepStatusLabel"></span></span>
            <a href="/jobs.html" class="btn btn-ghost" data-i18n="sweep.back"></a>
            <button class="btn btn-surface" id="exportBtn">
              <i data-icon="export"></i>
              <span data-i18n="results.export_btn"></span>
            </button>
          </div>
        </div>

        <!-- Vue globale -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.global_title"></div>
          </div>
          <div class="metrics-grid" id="globalMetricsGrid"></div>
        </div>

        <!-- Par catégorie de paire -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.categories_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="sweep.table.pair"></th>
                <th data-i18n="sweep.metric.count"></th>
                <th data-i18n="sweep.metric.avg_pnl"></th>
                <th data-i18n="sweep.metric.pct_profitable"></th>
                <th data-i18n="sweep.metric.best"></th>
                <th data-i18n="sweep.metric.worst"></th>
              </tr></thead>
              <tbody id="categoriesTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Sensibilité par paramètre -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.sensitivity_title"></div>
          </div>
          <div id="sensitivityContainer"></div>
        </div>

        <!-- Meilleures / pires combinaisons -->
        <div class="card">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.best_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="sweep.table.pair"></th>
                <th data-i18n="sweep.table.params"></th>
                <th data-i18n="sweep.table.pnl"></th>
                <th data-i18n="sweep.table.sharpe"></th>
                <th data-i18n="sweep.table.winrate"></th>
                <th data-i18n="sweep.table.maxdd"></th>
                <th data-i18n="sweep.table.action"></th>
              </tr></thead>
              <tbody id="bestTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.worst_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="sweep.table.pair"></th>
                <th data-i18n="sweep.table.params"></th>
                <th data-i18n="sweep.table.pnl"></th>
                <th data-i18n="sweep.table.sharpe"></th>
                <th data-i18n="sweep.table.winrate"></th>
                <th data-i18n="sweep.table.maxdd"></th>
                <th data-i18n="sweep.table.action"></th>
              </tr></thead>
              <tbody id="worstTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="tagPopover" class="tag-popover hidden">
    <div class="tag-popover-header">
      <span class="tag-popover-title" id="popoverTitle"></span>
      <button class="modal-close" id="popoverClose"><i data-icon="cross"></i></button>
    </div>
    <div id="popoverTagList" class="tag-popover-list"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script src="/js/export.js"></script>
  <script>
    const urlParams  = new URLSearchParams(location.search)
    const sweepId    = urlParams.get('id') ? parseInt(urlParams.get('id')) : null
    let pollInterval = null
    let currentSweep = null
    let allTags      = []
    let popoverJobId = null
    let popoverSelected = []

    document.addEventListener('header:ready', async () => {
      applyToDOM()
      if (!sweepId) { window.location.href = '/jobs.html'; return }
      await loadTags()
      await loadSweep()
    })
    initI18n()
    initExport()

    async function loadTags() {
      try { const { tags } = await api('/tags'); allTags = tags } catch (_) {}
    }

    function getJobTags(job) { return (job.jobTags || []).map(jt => jt.tag) }

    async function loadSweep() {
      try {
        const { sweep } = await api(`/sweeps/${sweepId}`)
        currentSweep = sweep
        _exportData = sweep
        window._exportData = sweep
        
        document.getElementById('loadingState').classList.add('hidden')
        document.getElementById('sweepContent').classList.remove('hidden')

        const isTerminal = sweep.status === 'done' || sweep.status === 'partial_error' || sweep.status === 'error'
        if (!isTerminal && !pollInterval) pollInterval = setInterval(loadSweep, 4000)
        if (isTerminal && pollInterval) { clearInterval(pollInterval); pollInterval = null }

        document.getElementById('sweepTitle').textContent = `${t('sweep.title')} - ${sweep.strategy.name}`
        document.getElementById('sweepMeta').textContent  = t('sweep.progress', { done: sweep.counts.done, total: sweep.totalRuns })
        document.getElementById('sweepStatusBadge').className = 'status-badge status-' + (sweep.status === 'partial_error' ? 'error' : sweep.status)
        document.getElementById('sweepStatusLabel').textContent = t('sweep.status.' + sweep.status)

        renderGlobalMetrics(sweep.global)
        renderCategories(sweep.byCategory)
        renderSensitivity(sweep.sensitivity)
        renderCombosTable('bestTableBody', sweep.best)
        renderCombosTable('worstTableBody', sweep.worst)
      } catch (e) {
        document.getElementById('loadingState').classList.add('hidden')
        document.getElementById('errorState').classList.remove('hidden')
      }
    }

    function fmtPct(v) { return v != null ? `${v >= 0 ? '+' : ''}${v.toFixed(2)}%` : '-' }

    function renderGlobalMetrics(g) {
      const grid = document.getElementById('globalMetricsGrid')
      if (!g) {
        grid.innerHTML = `<p class="text-muted text-sm p-sm">${t('sweep.no_results_yet')}</p>`
        return
      }
      const metrics = [
        { key: 'sweep.metric.count',          value: g.count,                                    cls: 'neutral' },
        { key: 'sweep.metric.avg_pnl',        value: fmtPct(g.avgPnlPercent),                     cls: g.avgPnlPercent >= 0 ? 'positive' : 'negative' },
        { key: 'sweep.metric.median_pnl',     value: fmtPct(g.medianPnlPercent),                  cls: g.medianPnlPercent >= 0 ? 'positive' : 'negative' },
        { key: 'sweep.metric.std_pnl',        value: g.stdPnlPercent.toFixed(2) + '%',             cls: 'neutral' },
        { key: 'sweep.metric.pct_profitable', value: g.pctProfitable.toFixed(1) + '%',             cls: g.pctProfitable >= 50 ? 'positive' : 'negative' },
        { key: 'sweep.metric.best',           value: fmtPct(g.bestPnlPercent),                    cls: g.bestPnlPercent >= 0 ? 'positive' : 'negative' },
        { key: 'sweep.metric.worst',          value: fmtPct(g.worstPnlPercent),                   cls: g.worstPnlPercent >= 0 ? 'positive' : 'negative' },
      ]
      grid.innerHTML = metrics.map(m => `
        <div class="metric-card">
          <div class="metric-label">${t(m.key)}</div>
          <div class="metric-value ${m.cls}">${m.value}</div>
        </div>`).join('')
    }

    function renderCategories(byCategory) {
      const body = document.getElementById('categoriesTableBody')
      if (!byCategory || !byCategory.length) {
        body.innerHTML = `<tr><td colspan="6" class="text-muted text-sm">${t('sweep.categories_empty')}</td></tr>`
        return
      }
      body.innerHTML = byCategory.map(c => {
        const label = c.categoryId === null
          ? `<span class="text-muted">${t('sweep.category.uncategorized')}</span>`
          : `<span class="tag tag-primary">${escHtml(c.name)}</span>`
        if (!c.stats) return `<tr><td>${label}</td><td colspan="5" class="text-muted text-sm">${t('sweep.no_results_yet')}</td></tr>`
        const s = c.stats
        return `<tr>
          <td>${label}</td>
          <td>${s.count}</td>
          <td class="${s.avgPnlPercent >= 0 ? 'pnl-positive' : 'pnl-negative'}">${fmtPct(s.avgPnlPercent)}</td>
          <td>${s.pctProfitable.toFixed(1)}%</td>
          <td class="${s.bestPnlPercent >= 0 ? 'pnl-positive' : 'pnl-negative'}">${fmtPct(s.bestPnlPercent)}</td>
          <td class="${s.worstPnlPercent >= 0 ? 'pnl-positive' : 'pnl-negative'}">${fmtPct(s.worstPnlPercent)}</td>
        </tr>`
      }).join('')
    }

    function renderSensitivity(sensitivity) {
      const container = document.getElementById('sensitivityContainer')
      if (!sensitivity || !sensitivity.length) {
        container.innerHTML = `<p class="text-muted text-sm p-sm">${t('sweep.sensitivity_empty')}</p>`
        return
      }
      container.innerHTML = sensitivity.map(axis => `
        <div class="mb-md">
          <div class="text-sm text-muted mb-sm" style="font-family:var(--mono)">${escHtml(axis.path)}</div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>${t('sweep.table.params')}</th>
                <th>${t('sweep.metric.count')}</th>
                <th>${t('sweep.metric.avg_pnl')}</th>
                <th>${t('sweep.metric.pct_profitable')}</th>
              </tr></thead>
              <tbody>
                ${axis.values.map(v => {
                  if (!v.stats) return `<tr><td>${escHtml(JSON.stringify(v.value))}</td><td colspan="3" class="text-muted text-sm">${t('sweep.no_results_yet')}</td></tr>`
                  return `<tr>
                    <td>${escHtml(JSON.stringify(v.value))}</td>
                    <td>${v.stats.count}</td>
                    <td class="${v.stats.avgPnlPercent >= 0 ? 'pnl-positive' : 'pnl-negative'}">${fmtPct(v.stats.avgPnlPercent)}</td>
                    <td>${v.stats.pctProfitable.toFixed(1)}%</td>
                  </tr>`
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `).join('')
    }
    
    function renderCombosTable(bodyId, jobs) {
      const body = document.getElementById(bodyId)
      if (!jobs || !jobs.length) {
        body.innerHTML = `<tr><td colspan="7" class="text-muted text-sm">${t('sweep.no_results_yet')}</td></tr>`
        return
      }
      body.innerHTML = jobs.map(j => {
        const tags = getJobTags(j)
        const tagsHtml = tags.map(tg =>
          `<span class="tag-chip" style="background:${tg.color}20;color:${tg.color};border-color:${tg.color}40">${escHtml(tg.name)}</span>`
        ).join('')
        return `
        <tr>
          <td>
            <span class="tag tag-primary">${escHtml(j.pair || '-')}</span>
            ${tagsHtml ? `<div class="job-row-tags">${tagsHtml}</div>` : ''}
          </td>
          <td class="text-muted text-sm" style="font-family:var(--mono)">${escHtml(Object.entries(j.paramValues || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ')) || '-'}</td>
          <td class="${j.pnlPercent >= 0 ? 'pnl-positive' : 'pnl-negative'}">${fmtPct(j.pnlPercent)}</td>
          <td>${j.sharpeRatio != null ? j.sharpeRatio.toFixed(2) : '-'}</td>
          <td>${j.winRate != null ? j.winRate.toFixed(1) + '%' : '-'}</td>
          <td style="color:var(--danger)">${j.maxDrawdown != null ? '-' + j.maxDrawdown.toFixed(2) + '%' : '-'}</td>
          <td>
            <a href="/results.html?jobId=${j.id}" class="btn btn-ghost btn-sm">${ICONS.chart}${t('sweep.table.view')}</a>
            <button class="btn btn-ghost btn-sm assign-tags-btn" data-id="${j.id}" title="Tags">${ICONS.tag}</button>
          </td>
        </tr>`
      }).join('')
      document.querySelectorAll('.assign-tags-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation()
          openTagPopover(parseInt(btn.dataset.id), btn)
        })
      })
    }

    function findJobById(id) {
      return [...(currentSweep?.best || []), ...(currentSweep?.worst || [])].find(j => j.id === id)
    }

    function openTagPopover(jobId, anchorEl) {
      const job = findJobById(jobId)
      if (!job) return

      popoverJobId    = jobId
      popoverSelected = getJobTags(job).map(tg => tg.id)

      document.getElementById('popoverTitle').textContent = `#${jobId}`

      const list = document.getElementById('popoverTagList')
      if (!allTags.length) {
        list.innerHTML = `<p class="text-muted text-sm p-sm">${t('jobs.assign.empty')}</p>`
      } else {
        list.innerHTML = allTags.map(tag => `
          <label class="assign-tag-row">
            <input type="checkbox" class="assign-tag-cb" data-id="${tag.id}" ${popoverSelected.includes(tag.id) ? 'checked' : ''}>
            <span class="tag-chip" style="background:${tag.color}20;color:${tag.color};border-color:${tag.color}40">${escHtml(tag.name)}</span>
          </label>
        `).join('')
        document.querySelectorAll('.assign-tag-cb').forEach(cb => {
          cb.addEventListener('change', async () => {
            const id = parseInt(cb.dataset.id)
            if (cb.checked) popoverSelected.push(id)
            else popoverSelected = popoverSelected.filter(x => x !== id)

            cb.disabled = true
            try {
              await api(`/tags/jobs/${popoverJobId}`, { method: 'PUT', body: { tagIds: popoverSelected } })
              loadSweep()
            } catch (e) {
              toast(t('error.' + e.code), 'error')
              cb.checked = !cb.checked
            } finally {
              cb.disabled = false
            }
          })
        })
      }

      const popover = document.getElementById('tagPopover')
      popover.classList.remove('hidden')
      const rect = anchorEl.getBoundingClientRect()
      const pw   = popover.offsetWidth  || 240
      const ph   = popover.offsetHeight || 300
      let top    = rect.bottom + 6
      let left   = rect.right  - pw
      if (left < 8) left = 8
      if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8
      if (top + ph > window.innerHeight - 8) top = rect.top - ph - 6
      popover.style.top  = top  + 'px'
      popover.style.left = left + 'px'
    }

    function closeTagPopover() {
      popoverJobId = null
      popoverSelected = []
      document.getElementById('tagPopover').classList.add('hidden')
    }
    document.getElementById('popoverClose').addEventListener('click', closeTagPopover)
    document.addEventListener('click', e => {
      const popover = document.getElementById('tagPopover')
      if (!popover.classList.contains('hidden') &&
          !popover.contains(e.target) &&
          !e.target.closest('.assign-tags-btn')) {
        closeTagPopover()
      }
    })

    function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
  </script>
</body>
</html>
