<!DOCTYPE html>
<html data-i18n-title="page.title.sweep">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/register-sw.js"></script>
</head>

<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="jobs"></header>

    <main class="app-main" id="sweepResults">
      <div id="loadingState" class="loading-spinner">
        <div class="spinner"></div>
      </div>

      <div id="errorState" class="empty-state hidden">
        <div class="empty-state-icon"><i data-icon="warning"></i></div>
        <h3 data-i18n="sweep.not_found"></h3>
        <a href="/jobs.html" class="btn btn-ghost" data-i18n="sweep.back"></a>
      </div>

      <div id="sweepContent" class="hidden">
        <div class="page-header">
          <div class="page-header-left">
            <h1 id="sweepTitle"></h1>
            <p id="sweepMeta"></p>
          </div>
          <div class="page-header-actions">
            <span class="status-badge" id="sweepStatusBadge"><span class="status-dot"></span><span
                id="sweepStatusLabel"></span></span>
            <a href="/jobs.html" class="btn btn-ghost" data-i18n="sweep.back"></a>
            <button class="btn btn-surface" id="exportBtn">
              <i data-icon="export"></i>
              <span data-i18n="results.export_btn"></span>
            </button>
          </div>
        </div>

        <!-- Vue globale -->
        <div class="metrics-grid" id="globalMetricsGrid"></div>

        <!-- By pair category -->
        <div class="card" id="categoriesCard">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.categories_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="sweep.table.pair"></th>
                  <th data-i18n="sweep.metric.count"></th>
                  <th data-i18n="sweep.metric.avg_pnl"></th>
                  <th data-i18n="sweep.metric.pct_profitable"></th>
                  <th data-i18n="sweep.metric.best"></th>
                  <th data-i18n="sweep.metric.worst"></th>
                </tr>
              </thead>
              <tbody id="categoriesTableBody"></tbody>
            </table>
          </div>
        </div>

        <!-- Sensitivity by parameter -->
        <div class="card" id="sensitivityCard">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.sensitivity_title"></div>
          </div>
          <div id="sensitivityContainer"></div>
        </div>

        <!-- Best / worst combinaisons -->
        <div class="card" id="bestCard">
          <div class="card-header">
            <div class="card-title" id="bestCardTitle" data-i18n="sweep.best_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="sweep.table.pair"></th>
                  <th data-i18n="sweep.table.params"></th>
                  <th data-i18n="sweep.table.pnl"></th>
                  <th data-i18n="sweep.table.sharpe"></th>
                  <th data-i18n="sweep.table.winrate"></th>
                  <th data-i18n="sweep.table.maxdd"></th>
                  <th data-i18n="sweep.table.action"></th>
                </tr>
              </thead>
              <tbody id="bestTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="card" id="worstCard">
          <div class="card-header">
            <div class="card-title" data-i18n="sweep.worst_title"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="sweep.table.pair"></th>
                  <th data-i18n="sweep.table.params"></th>
                  <th data-i18n="sweep.table.pnl"></th>
                  <th data-i18n="sweep.table.sharpe"></th>
                  <th data-i18n="sweep.table.winrate"></th>
                  <th data-i18n="sweep.table.maxdd"></th>
                  <th data-i18n="sweep.table.action"></th>
                </tr>
              </thead>
              <tbody id="worstTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="tagPopover" class="tag-popover hidden">
    <div class="tag-popover-header">
      <span class="tag-popover-title" id="popoverTitle"></span>
      <button class="modal-close" id="popoverClose"><i data-icon="cross"></i></button>
    </div>
    <div id="popoverTagList" class="tag-popover-list"></div>
  </div>

  <div id="failedRunsPopover" class="tag-popover failed-runs-popover hidden">
    <div class="tag-popover-header">
      <span class="tag-popover-title" data-i18n="sweep.failed_runs.title"></span>
      <button class="modal-close" id="failedRunsClose"><i data-icon="cross"></i></button>
    </div>
    <div id="failedRunsList" class="tag-popover-list"></div>
    <div class="tag-popover-footer hidden" id="failedRunsFooter">
      <button class="btn btn-ghost" id="failedRunsToggle"></button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script src="/js/export.js"></script>
  <script src="/js/sweep-labels.js"></script>
  <script src="/js/tag-manager.js"></script>
  <script src="/js/metric-cards.js"></script>

  <script src="/js/pages/sweep-results-core.js"></script>
  <script src="/js/pages/sweep-results-render.js"></script>
  <script src="/js/pages/sweep-results-tags.js"></script>
  <script src="/js/pages/sweep-results-failed.js"></script>
</body>

</html>
