<!DOCTYPE html>
<html data-i18n-title="page.title.login">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
</head>

<body>
  <main class="auth-main">
    <div class="auth-card">
      <div class="app-logo">
        <img src="/images/icons/192.png" class="app-logo-img app-logo-img--lg" alt="SnipeIT">
        <div class="app-title app-title--lg">Snipe<span>IT</span></div>
      </div>

      <section class="auth-section verify-section">
        <div class="verify-status" id="verifyStatus" data-state="pending">
          <div class="verify-icon verify-icon--pending" id="verifyIconPending">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9" stroke-dasharray="42 14" stroke-linecap="round" />
            </svg>
          </div>
          <div class="verify-icon verify-icon--success" id="verifyIconSuccess" hidden>
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="verify-icon verify-icon--error" id="verifyIconError" hidden>
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
            </svg>
          </div>
        </div>

        <h2 id="verifyTitle" data-i18n="verify.title"></h2>
        <p id="verifyMessage"></p>

        <a class="btn btn-primary btn-full hidden" id="verifyBackBtn" href="/index.html"
          data-i18n="verify.back_to_login"></a>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/pages/verify-email-page.js"></script>
</body>

</html>
