<!DOCTYPE html>
<html data-i18n-title="page.title.editor">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="strategies"></header>

    <main class="app-main">
      <div class="page-header">
        <div class="page-header-left">
          <h1 id="pageTitle" data-i18n="editor.title.new"></h1>
          <p data-i18n="editor.subtitle"></p>
        </div>
        <div class="page-header-actions">
          <span class="tag" id="sweepRunsBadge" style="display:none"></span>
          <a href="/strategies.html" class="btn btn-ghost" data-i18n="editor.cancel"></a>
          <button class="btn btn-surface" id="saveBtn">
            <i data-icon="save"></i> <span data-i18n="editor.save"></span>
          </button>
          <button class="btn btn-primary" id="saveAndRunBtn">
            <i data-icon="play"></i> <span data-i18n="editor.save_and_run"></span>
          </button>
        </div>
      </div>

      <p class="form-error global-error" id="globalError"></p>

      <!-- Mobile step nav -->
      <nav class="edit-mobile-nav" id="editMobileNav">
        <div class="mnav-item active" data-step="0">
          <i data-icon="clock"></i>
          <span data-i18n="editor.section.general"></span>
        </div>
        <div class="mnav-item" data-step="1">
          <i data-icon="shield"></i>
          <span data-i18n="editor.section.risk"></span>
        </div>
        <div class="mnav-item" data-step="2">
          <i data-icon="layers"></i>
          <span data-i18n="editor.section.conditions"></span>
        </div>
        <div class="mnav-item" data-step="3">
          <i data-icon="code"></i>
          <span data-i18n="editor.sidebar.json_title"></span>
        </div>
      </nav>

      <div class="editor-layout" id="editorLayout">

        <!-- Step 0: General + Market -->
        <div class="mobile-step" data-step="0">
          <div class="card">
            <div class="section-title" data-i18n="editor.section.general"></div>
            <div class="form-group">
              <label data-i18n="editor.field.name"></label>
              <input type="text" id="fName" data-i18n-attr="placeholder" data-i18n="editor.field.name_ph" maxlength="80">
            </div>
            <div class="form-group">
              <label data-i18n="editor.field.description"></label>
              <textarea id="fDescription" data-i18n-attr="placeholder" data-i18n="editor.field.description_ph"></textarea>
            </div>
          </div>

          <div class="card">
            <div class="section-title" data-i18n="editor.section.market"></div>
            <div class="form-row">
              <div class="form-group">
                <label data-i18n="editor.field.base_coins"></label>
                <coin-picker id="fBaseCoins"></coin-picker>
              </div>
              <div class="form-group">
                <label data-i18n="editor.field.quote_coins"></label>
                <coin-picker id="fQuoteCoins"></coin-picker>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group" style="grid-column: 1 / -1">
                <p class="text-muted text-sm" id="pairsEmptyMsg"></p>
                <div class="strategy-tags" id="pairsValidTags"></div>
                <div class="strategy-tags mt-sm" id="pairsInvalidTags"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label data-i18n="editor.field.timeframe"></label>
                <div class="toggle-group" id="fTimeframeGroup"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label data-i18n="editor.field.start_date"></label>
                <input type="date" id="fStartDate">
              </div>
              <div class="form-group">
                <label data-i18n="editor.field.end_date"></label>
                <input type="date" id="fEndDate">
              </div>
            </div>
          </div>
        </div>

        <!-- Step 1: Risk -->
        <div class="mobile-step" data-step="1">
          <div class="card sidebar-panel">
            <div class="section-title" data-i18n="editor.section.risk"></div>
            <div class="form-row">
              <div class="form-group">
                <label data-i18n="editor.field.capital"></label>
                <input type="number" id="fCapital" value="1000" min="1" step="1">
              </div>
              <div class="form-group">
                <label data-i18n="editor.field.position_size"></label>
                <input type="text" id="fPositionSize" value="10" inputmode="decimal">
                <p class="text-muted text-sm mt-sm" data-i18n="editor.field.sweep_number_hint"></p>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group fee-group">
                <label><span data-i18n="editor.field.fee_taker"></span> <span class="text-muted text-sm optional-label" data-i18n="editor.field.optional"></span></label>
                <div class="input-with-select">
                  <input type="number" id="fFeeTaker" value="0.1" min="0" max="10" step="0.01" placeholder="0.1">
                  <span class="input-addon">%</span>
                </div>
              </div>
              <div class="form-group fee-group">
                <label><span data-i18n="editor.field.fee_maker"></span> <span class="text-muted text-sm optional-label" data-i18n="editor.field.optional"></span></label>
                <div class="input-with-select">
                  <input type="number" id="fFeeMaker" value="0.1" min="0" max="10" step="0.01" placeholder="0.1">
                  <span class="input-addon">%</span>
                </div>
              </div>
            </div>

            <div class="divider mt-md mb-md"></div>

            <div class="form-row">
              <div class="form-group risk-group">
                <label><span data-i18n="editor.field.stop_loss"></span> <span class="text-muted text-sm optional-label" data-i18n="editor.field.optional"></span></label>
                <div class="input-with-select">
                  <input type="text" id="fStopLoss" data-i18n-attr="placeholder" data-i18n="editor.field.sl_ph" inputmode="decimal">
                  <div class="toggle-group" id="fSlTypeGroup"></div>
                </div>
                <label class="checkbox-label sl-trailing-label">
                  <input type="checkbox" id="fSlTrailing">
                  <span class="text-muted" data-i18n="editor.field.sl_trailing"></span>
                </label>
                <p class="text-muted text-sm mt-sm" data-i18n="editor.field.sweep_number_hint"></p>
              </div>
              <div class="form-group risk-group">
                <label><span data-i18n="editor.field.take_profit"></span> <span class="text-muted text-sm optional-label" data-i18n="editor.field.optional"></span></label>
                <div class="input-with-select">
                  <input type="text" id="fTakeProfit" data-i18n-attr="placeholder" data-i18n="editor.field.tp_ph" inputmode="decimal">
                  <div class="toggle-group" id="fTpTypeGroup"></div>
                </div>
                <p class="text-muted text-sm mt-sm" data-i18n="editor.field.sweep_number_hint"></p>
              </div>
            </div>
            <div class="form-row" id="atrPeriodGroup" style="display:none">
              <div class="form-group">
                <label data-i18n="editor.field.atr_period"></label>
                <input type="text" id="fAtrPeriod" value="14" inputmode="numeric">
              </div>
            </div>

            <div class="divider mt-md mb-md"></div>

            <div class="form-group">
              <label data-i18n="editor.field.trading_hours"></label>
              <div id="tradingHoursContainer"></div>
              <button type="button" class="btn btn-ghost btn-sm mt-sm" id="addTradingHourBtn" data-i18n="editor.field.trading_hours_add"></button>
              <p class="text-muted text-sm mt-sm" data-i18n="editor.field.trading_hours_hint"></p>
            </div>
          </div>
        </div>

        <!-- Step 2: Conditions -->
        <div class="mobile-step" data-step="2">
          <div class="card condition-card">
            <div class="section-title" data-i18n="editor.section.conditions"></div>
            <div class="conditions-block">
              <div class="condition-tabs">
                <button class="btn btn-ghost condition-tab active-entry" id="tabEntry">
                  <i data-icon="enter"></i>
                  <span data-i18n="editor.cond.tab_entry"></span>
                </button>
                <button class="btn btn-ghost condition-tab" id="tabExit">
                  <i data-icon="exit"></i>
                  <span data-i18n="editor.cond.tab_exit"></span>
                </button>
              </div>
              <div id="entryConditions" class="conditions-panel"></div>
              <div id="exitConditions"  class="conditions-panel conditions-panel--hidden"></div>
              <div class="conditions-actions">
                <button class="add-condition-btn" id="addGroupBtn">
                  <i data-icon="plus"></i>
                  <span data-i18n="editor.cond.add_group"></span>
                </button>
              </div>
            </div>
            <p class="text-muted text-sm mt-md" data-i18n="editor.cond.hint"></p>
          </div>
        </div>

        <!-- Step 3: Preview + indicators legend -->
        <div class="mobile-step" data-step="3">
          <div class="card sidebar-panel">
            <div class="card-header">
              <div class="section-title" data-i18n="editor.sidebar.json_title"></div>
              <span class="text-muted text-sm" data-i18n="editor.sidebar.json_sub"></span>
            </div>
            <pre class="preview-json" id="jsonPreview">{}</pre>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div id="sweepConfirmModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" data-i18n="editor.sweep_confirm.title"></div>
        <button class="modal-close" id="sweepConfirmClose"><i data-icon="cross"></i></button>
      </div>
      <p class="text-muted" id="sweepConfirmDesc"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="sweepConfirmCancel" data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="sweepConfirmOk" data-i18n="editor.sweep_confirm.ok"></button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script src="/js/sweep-parse.js"></script>
  <script src="/js/coin-picker.js"></script>
  <script src="/js/indicator-config.js"></script>
  <script src="/js/indicator-picker.js"></script>
  <script src="/js/condition-renderer.js"></script>
  <script src="/js/condition-settings.js"></script>
  <script src="/js/strategy-form.js"></script>
  <script src="/js/form-validate.js"></script>
  <script src="/js/pages/strategy-editor-page.js"></script>  
</body>
</html>
