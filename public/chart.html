<!DOCTYPE html>
<html data-i18n-title="page.title.chart">
<head>
  <meta charset="UTF-8" />
  <title>SnipeIT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/register-sw.js"></script>
</head>
<body>
  <div class="app-layout chart-layout">
    <header class="app-header" id="appHeader" data-active="jobs"></header>

    <main class="chart-page">
      <div id="loadingState" class="chart-loading">
        <div class="chart-loading-skeleton">
          <div class="skeleton-bar" style="height:40%"></div>
          <div class="skeleton-bar" style="height:65%"></div>
          <div class="skeleton-bar" style="height:90%"></div>
          <div class="skeleton-bar" style="height:55%"></div>
          <div class="skeleton-bar" style="height:35%"></div>
          <div class="skeleton-bar" style="height:60%"></div>
          <div class="skeleton-bar" style="height:45%"></div>
        </div>
        <p class="chart-loading-text" data-i18n="chart.loading"></p>
        <p class="chart-loading-subtext hidden" id="loadingSubtext" data-i18n="chart.loading_slow"></p>
      </div>

      <div id="errorState" class="empty-state hidden">
        <div class="empty-state-icon"><i data-icon="warning"></i></div>
        <h3 id="errorTitle" data-i18n="results.error_title"></h3>
        <p id="errorMsg"></p>
        <a href="/jobs.html" class="btn btn-ghost" data-i18n="results.back_jobs"></a>
      </div>

      <div id="pendingState" class="empty-state hidden">
        <div class="empty-state-icon beating"><i data-icon="play"></i></div>
        <h3 data-i18n="results.pending_title"></h3>
        <p data-i18n="results.pending_desc"></p>
        <a href="/jobs.html" class="btn btn-ghost" data-i18n="results.back_jobs"></a>
      </div>

      <div id="chartContent" class="chart-content hidden">
        <div class="chart-topbar">
          <div class="chart-topbar-left">
            <a id="backToResultsBtn" class="btn btn-ghost btn-sm" href="/jobs.html">
              <i data-icon="chevron_left"></i>
              <span data-i18n="chart.back_to_results"></span>
            </a>
            <div class="chart-meta" id="chartMeta"></div>
          </div>
          <div class="chart-topbar-right">
            <button class="btn btn-ghost btn-sm" id="indicatorsBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <i data-icon="layers"></i>
              <span data-i18n="chart.indicators_btn"></span>
            </button>
            <div class="indicators-menu hidden" id="indicatorsMenu">
              <div class="indicators-menu-title" data-i18n="chart.indicators_btn"></div>
              <div id="indicatorsMenuBody"></div>
              <div class="indicators-menu-empty hidden" id="indicatorsMenuEmpty" data-i18n="chart.indicators_empty"></div>
            </div>
          </div>
        </div>

        <div class="chart-warnings hidden" id="chartWarnings"></div>

        <div class="chart-area">
          <div class="chart-main-pane" id="chartMainPane">
            <div class="pane-legend" id="legend-main"></div>
          </div>
          <div class="chart-panels" id="panels"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/trade-chart.js"></script>
</body>
</html>
