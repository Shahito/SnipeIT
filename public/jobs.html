<!DOCTYPE html>
<html data-i18n-title="page.title.jobs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/register-sw.js"></script>
</head>

<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="jobs"></header>

    <main class="app-main" id="jobsMain">
      <div class="jobs-page-header">
        <div class="page-header-left">
          <h1 data-i18n="jobs.title"></h1>
          <p data-i18n="jobs.subtitle"></p>
        </div>
        <div class="jobs-toolbar">
          <div id="workerStatus" class="status-badge status-error">
            <span class="status-dot"></span><span id="workerStatusLabel"></span>
          </div>
          <span>
            <button class="btn btn-ghost btn-sm" id="manageTagsBtn">
              <i data-icon="tag"></i>
              <span data-i18n="jobs.btn.tags"></span>
            </button>
            <button class="btn btn-ghost btn-sm" id="filtersToggleBtn" aria-expanded="false"
              aria-controls="jobsFiltersPanel">
              <i data-icon="filter"></i>
              <span data-i18n="jobs.btn.filters"></span>
            </button>
            <button class="btn btn-ghost btn-sm" id="refreshBtn">
              <i data-icon="replay"></i>
              <span data-i18n="jobs.btn.refresh"></span>
            </button>
          </span>
        </div>
      </div>

      <div class="jobs-controls card hidden" id="jobsFiltersPanel">
        <div class="jobs-controls-row">
          <div class="jobs-control-group">
            <span class="jobs-control-label" data-i18n="jobs.sort.label"></span>
            <div class="custom-select" id="sortSelect" data-value="date">
              <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value"></span>
                <i data-icon="chevron_down"></i>
              </button>
              <div class="custom-select-menu hidden" role="listbox">
                <div class="custom-select-option active" data-value="date" role="option" data-i18n="jobs.sort.date">
                </div>
                <div class="custom-select-option" data-value="pnl" role="option" data-i18n="jobs.sort.pnl"></div>
                <div class="custom-select-option" data-value="sharpe" role="option" data-i18n="jobs.sort.sharpe"></div>
                <div class="custom-select-option" data-value="winrate" role="option" data-i18n="jobs.sort.winrate">
                </div>
                <div class="custom-select-option" data-value="drawdown" role="option" data-i18n="jobs.sort.drawdown">
                </div>
                <div class="custom-select-option" data-value="trades" role="option" data-i18n="jobs.sort.trades"></div>
              </div>
            </div>
            <button class="sort-dir-btn" id="sortDirBtn" data-i18n-attr="title" data-i18n="jobs.sort.direction">
              <i data-icon="sort_arrow_down"></i>
            </button>
          </div>
          <div class="jobs-control-sep"></div>
          <div class="jobs-control-group">
            <span class="jobs-control-label" data-i18n="jobs.group.label"></span>
            <div class="custom-select" id="groupSelect" data-value="none">
              <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value"></span>
                <i data-icon="chevron_down"></i>
              </button>
              <div class="custom-select-menu hidden" role="listbox">
                <div class="custom-select-option active" data-value="none" role="option" data-i18n="jobs.group.none">
                </div>
                <div class="custom-select-option" data-value="pair" role="option" data-i18n="jobs.group.pair"></div>
                <div class="custom-select-option" data-value="tag" role="option" data-i18n="jobs.group.tag"></div>
                <div class="custom-select-option" data-value="profit" role="option" data-i18n="jobs.group.profit"></div>
                <div class="custom-select-option" data-value="status" role="option" data-i18n="jobs.group.status"></div>
                <div class="custom-select-option" data-value="strategy" role="option" data-i18n="jobs.group.strategy">
                </div>
              </div>
            </div>
          </div>
          <div class="jobs-control-sep"></div>
          <div class="jobs-control-group">
            <span class="jobs-control-label" data-i18n="jobs.filter.label"></span>
            <div class="custom-select" id="filterSelect" data-value="all">
              <button type="button" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value"></span>
                <i data-icon="chevron_down"></i>
              </button>
              <div class="custom-select-menu hidden" role="listbox">
                <div class="custom-select-option active" data-value="all" role="option" data-i18n="jobs.filter.all">
                </div>
                <div class="custom-select-option" data-value="pending" role="option" data-i18n="jobs.filter.pending">
                </div>
                <div class="custom-select-option" data-value="running" role="option" data-i18n="jobs.filter.running">
                </div>
                <div class="custom-select-option" data-value="done" role="option" data-i18n="jobs.filter.done"></div>
                <div class="custom-select-option" data-value="error" role="option" data-i18n="jobs.filter.error"></div>
              </div>
            </div>
          </div>
          <div class="jobs-control-sep"></div>
          <button class="btn btn-ghost btn-sm" id="clearFiltersBtn">
            <i data-icon="brush"></i>
            <span data-i18n="jobs.btn.clear_filters"></span>
          </button>
        </div>
      </div>

      <div id="loadingState" class="loading-spinner">
        <div class="spinner"></div>
      </div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-state-icon"><i data-icon="gear"></i></div>
        <h3 id="emptyTitle" data-i18n="jobs.empty.title"></h3>
        <p id="emptyDesc" data-i18n="jobs.empty.desc"></p>
        <a href="/strategies.html" class="btn btn-primary" id="emptyCreateBtn" data-i18n="jobs.empty.btn"></a>
        <button class="btn btn-ghost hidden" id="emptyResetBtn" data-i18n="jobs.empty.reset_btn"></button>
      </div>
      <div id="jobsContent" class="hidden"></div>
      <div id="paginationBar" class="pagination-bar hidden">
        <button class="btn btn-ghost btn-sm hidden" id="firstPageBtn"><i data-icon="chevron_first"></i></button>
        <button class="btn btn-ghost btn-sm" id="prevPageBtn"><i data-icon="chevron_left"></i></button>
        <span id="pageIndicator" class="text-muted text-sm"></span>
        <button class="btn btn-ghost btn-sm" id="nextPageBtn"><i data-icon="chevron_right"></i></button>
        <button class="btn btn-ghost btn-sm hidden" id="lastPageBtn"><i data-icon="chevron_last"></i></button>
      </div>
    </main>
  </div>

  <!-- Modal gestion tags -->
  <div id="tagsModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">
          <i data-icon="tag"></i>
          <span data-i18n="jobs.tags.modal_title"></span>
        </div>
        <button class="modal-close" id="tagsModalClose"><i data-icon="cross"></i></button>
      </div>
      <div class="tag-create-form">
        <input type="text" id="tagNameInput" data-i18n-attr="placeholder" data-i18n="jobs.tags.name_ph" maxlength="32">
        <div id="tagPaletteContainer"></div>
        <button class="btn btn-primary btn-sm" id="createTagBtn" data-i18n="jobs.tags.create_btn"></button>
      </div>
      <p class="form-error" id="tagCreateError"></p>
      <div class="divider"></div>
      <div id="tagsList" class="tags-manage-list"></div>
    </div>
  </div>

  <!-- Popover contextuel assigner tags -->
  <div id="tagPopover" class="tag-popover hidden">
    <div class="tag-popover-header">
      <span class="tag-popover-title" id="popoverTitle"></span>
      <button class="modal-close" id="popoverClose"><i data-icon="cross"></i></button>
    </div>
    <div id="popoverTagList" class="tag-popover-list"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script src="/js/tag-palette.js"></script>
  <script src="/js/tag-manager.js"></script>
  <script src="/js/custom-select.js"></script>

  <script src="/js/pages/jobs-core.js"></script>
  <script src="/js/pages/jobs-controls.js"></script>
  <script src="/js/pages/jobs-render.js"></script>
  <script src="/js/pages/jobs-tags.js"></script>
</body>

</html>
