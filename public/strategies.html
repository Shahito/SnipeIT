<!DOCTYPE html>
<html data-i18n-title="page.title.strategies">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="strategies"></header>

    <main class="app-main">
      <div class="page-header">
        <div class="page-header-left">
          <h1 data-i18n="strategies.title"></h1>
          <p data-i18n="strategies.subtitle"></p>
        </div>
        <a href="/strategy-editor.html" class="btn btn-primary">
          <i data-icon="plus"></i>
          <span data-i18n="strategies.new_btn"></span>
        </a>
      </div>

      <div id="loadingState" class="loading-spinner"><div class="spinner"></div></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-state-icon">
          <i data-icon="chart"></i>
        </div>
        <h3 data-i18n="strategies.empty_title"></h3>
        <p data-i18n="strategies.empty_desc"></p>
        <a href="/strategy-editor.html" class="btn btn-primary">
          <i data-icon="plus"></i>
          <span data-i18n="strategies.empty_btn"></span>
        </a>
      </div>

      <div id="strategiesGrid" class="strategies-grid hidden"></div>
    </main>
  </div>

  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" data-i18n="strategies.delete.title"></div>
        <button class="modal-close" id="deleteModalClose"><i data-icon="cross"></i></button>
      </div>
      <p class="text-muted" data-i18n="strategies.delete.desc"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="deleteCancelBtn" data-i18n="common.cancel"></button>
        <button class="btn btn-danger" id="deleteConfirmBtn" data-i18n="strategies.delete.confirm"></button>
      </div>
    </div>
  </div>

  <div id="sweepConfirmModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" data-i18n="editor.sweep_confirm.title"></div>
        <button class="modal-close" id="sweepConfirmClose"><i data-icon="cross"></i></button>
      </div>
      <p class="text-muted" id="sweepConfirmDesc"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="sweepConfirmCancel" data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="sweepConfirmOk" data-i18n="editor.sweep_confirm.ok"></button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/sweep-parse.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script src="/js/pages/strategies-list.js"></script>
  <script src="/js/pages/strategies-actions.js"></script>
</body>
</html>
