<!DOCTYPE html>
<html data-i18n-title="page.title.strategies">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header" id="appHeader" data-active="strategies"></header>

    <main class="app-main">
      <div class="page-header">
        <div class="page-header-left">
          <h1 data-i18n="strategies.title"></h1>
          <p data-i18n="strategies.subtitle"></p>
        </div>
        <a href="/strategy-editor.html" class="btn btn-primary">
          <i data-icon="plus"></i>
          <span data-i18n="strategies.new_btn"></span>
        </a>
      </div>

      <div id="loadingState" class="loading-spinner"><div class="spinner"></div></div>

      <div id="emptyState" class="empty-state hidden">
        <div class="empty-state-icon">
          <i data-icon="chart"></i>
        </div>
        <h3 data-i18n="strategies.empty_title"></h3>
        <p data-i18n="strategies.empty_desc"></p>
        <a href="/strategy-editor.html" class="btn btn-primary">
          <i data-icon="plus"></i>
          <span data-i18n="strategies.empty_btn"></span>
        </a>
      </div>

      <div id="strategiesGrid" class="strategies-grid hidden"></div>
    </main>
  </div>

  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" data-i18n="strategies.delete.title"></div>
        <button class="modal-close" id="deleteModalClose"><i data-icon="cross"></i></button>
      </div>
      <p class="text-muted" data-i18n="strategies.delete.desc"></p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="deleteCancelBtn" data-i18n="common.cancel"></button>
        <button class="btn btn-danger" id="deleteConfirmBtn" data-i18n="strategies.delete.confirm"></button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/overlay-a11y.js"></script>
  <script>
    let deleteTargetId = null
    let autoRefreshTimer = null

    document.addEventListener('header:ready', async () => {
      applyToDOM()
      await loadStrategies()
      autoRefreshTimer = setInterval(async () => { await loadStrategies() }, 5000)
    })
    initI18n()

    let _lastStrategiesHash = null

    async function loadStrategies() {
      try {
        const { strategies } = await api('/strategies')
        document.getElementById('loadingState').classList.add('hidden')
        if (!strategies.length) {
          document.getElementById('emptyState').classList.remove('hidden')
          document.getElementById('strategiesGrid').classList.add('hidden')
          _lastStrategiesHash = null
          return
        }

        const hash = JSON.stringify(strategies)
        if (hash === _lastStrategiesHash) return // no change, skip DOM rebuild
        _lastStrategiesHash = hash

        document.getElementById('emptyState').classList.add('hidden')
        const grid = document.getElementById('strategiesGrid')
        grid.classList.remove('hidden')
        grid.innerHTML = strategies.map(renderStrategyCard).join('')
        bindCardActions()
      } catch (e) {
        toast(t('strategies.load_error'), 'error')
      }
    }

    function renderStrategyCard(s) {
      const lastJob   = s.jobs?.[0]
      const statusHtml = lastJob
        ? `<span class="status-badge status-${lastJob.status}"><span class="status-dot"></span>${t('status.' + lastJob.status)}</span>`
        : `<span class="status-badge status-none"><span class="status-dot"></span>${t('strategies.never_launched')}</span>`

      const pnl = lastJob?.status === 'done' && lastJob.result?.pnlPercent != null
        ? `<span class="tag ${lastJob.result.pnlPercent >= 0 ? 'tag-success' : 'tag-danger'}">${lastJob.result.pnlPercent >= 0 ? '+' : ''}${lastJob.result.pnlPercent.toFixed(2)}%</span>`
        : ''

      return `
        <div class="strategy-card" data-id="${s.id}">
          <div class="strategy-card-header">
            <div class="strategy-card-sup">
              <button class="btn btn-danger btn-sm delete-btn" data-id="${s.id}">${ICONS.cross}</button>
              ${statusHtml}
            </div>
            <div class="strategy-card-title">${escHtml(s.name)}</div>
          </div>
          ${s.description ? 
            `<div class="strategy-card-desc" data-tooltip="${escHtml(s.description)}">${escHtml(s.description)}</div>`
            :`<div class="strategy-card-desc">${t("strategies.no_desc")}</div>`
          }
          <div class="strategy-tags">
            <span class="tag tag-primary">${escHtml(s.pair)}</span>
            <span class="tag">${escHtml(s.timeframe)}</span>
            <span class="tag">${fmtDate(s.startDate)} - ${fmtDate(s.endDate)}</span>
            ${pnl}
          </div>
          <div class="strategy-card-actions">
            ${lastJob?.status != 'pending' && lastJob?.status != 'running' ?
            `<button class="btn btn-sm launch-btn
              ${lastJob?.status === 'done' ? 'btn-ghost':' btn-primary'}" data-id="${s.id}">
                ${lastJob?.status === 'done' ?
                  `${ICONS.replay}${t('strategies.btn.relaunch')}` :
                  `${ICONS.play}${t('strategies.btn.launch')}`
                }</button>`:
                ''
              }
            <a href="/strategy-editor.html?id=${s.id}" class="btn btn-ghost btn-sm">${ICONS.pencil}${t('strategies.btn.edit')}</a>
            <button class="btn btn-ghost btn-sm clone-btn" data-id="${s.id}">${ICONS.copy}${t('strategies.btn.clone')}</button>
            ${lastJob?.status === 'done' ? `<a href="/results.html?jobId=${lastJob.id}" class="btn btn-ghost btn-sm">${ICONS.chart}${t('strategies.btn.results')}</a>` : ''}
          </div>
        </div>`
    }

    function bindCardActions() {
      // Tooltip
      let tooltipEl = document.getElementById('descTooltip')
      if (!tooltipEl) {
        tooltipEl = document.createElement('div')
        tooltipEl.id = 'descTooltip'
        document.body.appendChild(tooltipEl)
      }

      document.querySelectorAll('.strategy-card-desc').forEach(el => {
        const text = el.dataset.tooltip
        if (!text) return
        const show = (x, y) => {
          tooltipEl.textContent = text
          tooltipEl.style.opacity = '0'
          tooltipEl.style.left = '0'
          tooltipEl.style.top = '0'

          const tw = tooltipEl.offsetWidth
          const th = tooltipEl.offsetHeight
          const vw = window.innerWidth
          const vh = window.innerHeight
          const offset = 12
          
          const isMobileWidth = vw <= 850 // 32 = 2rem
          const margin = 8
          const left = isMobileWidth
            ? (vw - tw) / 2
            : x + offset + tw > vw
              ? x - tw - offset
              : x + offset
          
          const leftClamped = Math.min(Math.max(left, margin), vw - tw - margin)

          tooltipEl.style.left = leftClamped + 'px'

          const top = y + offset + th > vh ? y - th - offset : y + offset

          tooltipEl.style.left = left + 'px'
          tooltipEl.style.top  = top  + 'px'
          tooltipEl.style.opacity = '1'
        }
        const hide = () => tooltipEl.style.opacity = '0'

        el.addEventListener('mouseenter', e => show(e.clientX + 12, e.clientY + 12))
        el.addEventListener('mousemove',  e => show(e.clientX + 12, e.clientY + 12))
        el.addEventListener('mouseleave', hide)

        el.addEventListener('touchstart', e => {
          const t = e.touches[0]
          show(t.clientX + 12, t.clientY + 12)
        }, { passive: true })
        el.addEventListener('touchend', () => setTimeout(hide, 1500))
      })
      document.querySelectorAll('.launch-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = parseInt(btn.dataset.id)
          btn.disabled = true; btn.textContent = '...'
          try {
            await api('/jobs', { method: 'POST', body: { strategyId: id } })
            toast(t('strategies.job_launched'), 'success')
            loadStrategies()
          } catch (e) {
            toast(t('error.' + e.code), 'error')
            btn.disabled = false; btn.innerHTML = `${ICONS.play}${t('strategies.btn.launch')}`
          }
        })
      })
      document.querySelectorAll('.clone-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true
          try {
            const { strategy } = await api(`/strategies/${btn.dataset.id}/clone`, { method: 'POST' })
            toast(t('strategies.cloned'), 'success')
            window.location.href = `/strategy-editor.html?id=${strategy.id}`
          } catch (e) { toast(t('error.' + e.code), 'error'); btn.disabled = false }
        })
      })
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          deleteTargetId = parseInt(btn.dataset.id)
          openModal('deleteModal', 'deleteCancelBtn')
        })
      })
    }

    document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal)
    document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal)
    document.getElementById('deleteConfirmBtn').addEventListener('click', async () => {
      if (!deleteTargetId) return
      try {
        await api(`/strategies/${deleteTargetId}`, { method: 'DELETE' })
        toast(t('strategies.deleted'), 'success')
        closeDeleteModal(); loadStrategies()
      } catch (e) { toast(t('error.' + e.code), 'error') }
    })

    bindModalKeys('deleteModal', {
      onConfirm: () => document.getElementById('deleteConfirmBtn').click(),
      onCancel: closeDeleteModal,
    })

    function closeDeleteModal() {
      deleteTargetId = null
      closeModal('deleteModal')
    }

    function fmtDate(d) { return new Date(d).toLocaleDateString(i18nCurrentLang() === 'fr' ? 'fr-FR' : 'en-GB', { day:'2-digit', month:'2-digit', year:'2-digit' }) }
    function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
  </script>
</body>
</html>
