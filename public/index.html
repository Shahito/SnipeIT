<!DOCTYPE html>
<html data-i18n-title="page.title.login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnipeIT</title>
  <link rel="icon" type="image/png" href="/images/tab/tab-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/register-sw.js"></script>
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">

      <div class="app-logo">
        <img src="/images/icons/192.png" class="app-logo-img app-logo-img--lg" alt="SnipeIT">
        <div class="app-title app-title--lg">Snipe<span>IT</span></div>
      </div>

      <!-- LOGIN -->
      <section id="loginSection" class="auth-section">
        <h2 data-i18n="login.login_title"></h2>

        <div class="form-group">
          <label for="loginUsername" data-i18n="login.username"></label>
          <input type="text" id="loginUsername" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="loginPassword" data-i18n="login.password"></label>
          <div class="password-field">
            <input type="password" id="loginPassword" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="loginPasswordToggle"
                    data-i18n-attr="aria-label" data-i18n="login.show_password" aria-pressed="false">
              <span class="icon-eye"><i data-icon="eye"></i></span>
              <span class="icon-eye-off" hidden><i data-icon="eye_off"></i></span>
            </button>
          </div>
        </div>

        <p class="form-error" id="loginError" role="alert" aria-live="polite"></p>
        <p class="switch-link hidden" id="resendVerificationWrap">
          <span id="resendVerificationLink" data-i18n="login.resend_verification"></span>
        </p>
        <button class="btn btn-primary btn-full" id="loginBtn" data-i18n="login.login_btn"></button>
        <p class="switch-link"><span id="toRegister" data-i18n="login.to_register"></span></p>
      </section>

      <!-- REGISTER -->
      <section id="registerSection" class="auth-section hidden">
        <h2 data-i18n="login.register_title"></h2>

        <div class="form-group">
          <label for="regUsername" data-i18n="login.username"></label>
          <input type="text" id="regUsername" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="regEmail" data-i18n="login.email"></label>
          <input type="email" id="regEmail" autocomplete="email" inputmode="email" required>
          <span class="field-hint hidden" id="regEmailHint" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="regPassword" data-i18n="login.password"></label>
          <div class="password-field">
            <input type="password" id="regPassword" data-i18n-attr="placeholder" data-i18n="login.password_hint"
                   autocomplete="new-password" minlength="10" required
                   aria-describedby="regPasswordChecklist">
            <button type="button" class="password-toggle" id="regPasswordToggle"
                    data-i18n-attr="aria-label" data-i18n="login.show_password" aria-pressed="false">
              <span class="icon-eye"><i data-icon="eye"></i></span>
              <span class="icon-eye-off" hidden><i data-icon="eye_off"></i></span>
            </button>
          </div>
          <ul class="password-checklist" id="regPasswordChecklist" role="list">
            <li class="password-checklist__item" data-rule="length"><span class="password-checklist__icon"></span><span data-i18n="password_rule.length"></span></li>
            <li class="password-checklist__item" data-rule="lowercase"><span class="password-checklist__icon"></span><span data-i18n="password_rule.lowercase"></span></li>
            <li class="password-checklist__item" data-rule="uppercase"><span class="password-checklist__icon"></span><span data-i18n="password_rule.uppercase"></span></li>
            <li class="password-checklist__item" data-rule="digit"><span class="password-checklist__icon"></span><span data-i18n="password_rule.digit"></span></li>
            <li class="password-checklist__item" data-rule="special"><span class="password-checklist__icon"></span><span data-i18n="password_rule.special"></span></li>
          </ul>
        </div>

        <div class="form-group">
          <label for="regPasswordConfirm" data-i18n="login.confirm_password"></label>
          <div class="password-field">
            <input type="password" id="regPasswordConfirm" autocomplete="new-password" minlength="10" required>            <button type="button" class="password-toggle" id="regPasswordConfirmToggle"
                    data-i18n-attr="aria-label" data-i18n="login.show_password" aria-pressed="false">
              <span class="icon-eye"><i data-icon="eye"></i></span>
              <span class="icon-eye-off" hidden><i data-icon="eye_off"></i></span>
            </button>
          </div>
        </div>

        <p class="form-error" id="registerError" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary btn-full" id="registerBtn" data-i18n="login.register_btn"></button>
        <p class="switch-link"><span id="toLogin" data-i18n="login.to_login"></span></p>
      </section>

      <div class="auth-lang">
        <button class="btn btn-ghost btn-sm lang-btn" id="langBtn"></button>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/utils/password-policy.js"></script>
  <script src="/js/pages/auth-page.js"></script>
  </body>
</html>
